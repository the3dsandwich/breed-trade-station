name: Docker Build

on:
  pull_request:
    branches: [main]
    paths:
      - compose.yaml
      - apps/game/Dockerfile
      - .github/workflows/docker-build.yml
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-game-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push game Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/game/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/breed-trade-station/game:latest
            ghcr.io/${{ github.repository_owner }}/breed-trade-station/game:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
