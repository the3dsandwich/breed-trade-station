name: Docs Ratchet

on:
  pull_request:
    branches: [main]

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check docs updated alongside code changes
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          HEAD=${{ github.event.pull_request.head.sha }}

          CHANGED=$(git diff --name-only "$BASE" "$HEAD")

          CODE_CHANGED=$(echo "$CHANGED" | grep -E '^(apps|packages|ai)/' || true)
          DOCS_CHANGED=$(echo "$CHANGED" | grep -E '^docs/(design|architecture)/' || true)

          if [ -n "$CODE_CHANGED" ] && [ -z "$DOCS_CHANGED" ]; then
            echo "❌ Docs ratchet failed."
            echo ""
            echo "This PR modifies files in apps/, packages/, or ai/ but does not update docs/design/ or docs/architecture/."
            echo ""
            echo "Changed code files:"
            echo "$CODE_CHANGED"
            echo ""
            echo "Document your changes in docs/design/ or docs/architecture/ before merging."
            exit 1
          fi

          echo "✅ Docs check passed."
