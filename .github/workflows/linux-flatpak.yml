name: Linux Flatpak

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_run_id:
        description: 'Publish an already passed main build (run number); leave empty to build normally'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: linux-flatpak-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flatpak:
    if: inputs.publish_run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb dbus-x11 openbox wmctrl imagemagick xdotool
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Flatpak SDK
        run: |
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub org.gnome.Platform//49 org.gnome.Sdk//49 org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build frontend and stage locked Rust sources
        run: pnpm linux:stage

      - name: Build Linux app inside Flatpak SDK
        run: pnpm linux:build

      - name: Install and play-test Flatpak
        run: |
          flatpak install --user --noninteractive artifacts/BreedTradeStation-linux-x86_64.flatpak
          timeout 240 bash scripts/linux/test-flatpak.sh

      - name: Upload Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: BreedTradeStation-linux-x86_64-${{ github.sha }}
          path: artifacts/BreedTradeStation-linux-x86_64.flatpak
          if-no-files-found: error
          retention-days: 14

      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-native-test-${{ github.sha }}
          path: artifacts/native-test/
          if-no-files-found: ignore
          retention-days: 14

  release:
    needs: flatpak
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: BreedTradeStation-linux-x86_64-${{ github.sha }}
          path: artifacts

      - name: Publish tested Flatpak as a development release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/linux/release.sh

  source:
    needs: flatpak
    if: >-
      always() && !cancelled() &&
      ((github.ref == 'refs/heads/main' && needs.flatpak.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish_run_id != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: flatpak-pages
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Install repository tools
        run: sudo apt-get update && sudo apt-get install -y flatpak ostree gnupg
      - name: Fetch only a tested main build
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RUN_ID: ${{ inputs.publish_run_id }}
        run: python3 scripts/linux/fetch-source.py
      - name: Sign source and test install and update
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: bash scripts/linux/prepare-source.sh
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-source-test-${{ github.run_id }}
          path: artifacts/source-test.txt
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/pages
      - name: Publish Flatpak source
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Verify public source
        run: bash scripts/linux/verify-source.sh
